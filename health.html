<!DOCTYPE html>
<html>

<head>


<title>System Health - AI Legal Analyzer</title>


<link 
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
rel="stylesheet">


<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">


</head>



<body>



<nav class="navbar">


<div class="logo">

AI Legal Analyzer

</div>


<nav>

<a href="{{url_for('dashboard')}}">
Dashboard
</a>


<a href="{{url_for('upload_page')}}">
Upload
</a>


<a href="{{url_for('chat_page')}}">
AI Assistant
</a>


</nav>


</nav>





<div class="container mt-5">



<h1 class="text-warning mb-4">

❤️ System Health

</h1>





<div class="panel">



<div class="card mb-3">

<div class="card-body">


<h4>
Application
</h4>


<p>
{{health['application']}}
</p>


</div>

</div>





<div class="card mb-3">

<div class="card-body">


<h4>
Database
</h4>


<p>
{{health['database']}}
</p>


</div>

</div>





<div class="card mb-3">

<div class="card-body">


<h4>
Status
</h4>


<h3 class="text-success">

{{health['status']}}

</h3>


</div>

</div>



</div>





<a href="{{url_for('dashboard')}}" 
class="btn btn-warning">

⬅ Back to Dashboard

</a>



</div>





</body>

</html>
